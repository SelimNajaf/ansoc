<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare stores</title>
  <link rel="stylesheet" href="../analyzer/analyzer.css">
  <link rel="stylesheet" href="compare.css">
</head>
<body>
  <header class="top">
    <span class="logo" aria-hidden="true">↓</span>
    <div class="grow">
      <h1 data-i18n="cmp_title"></h1>
      <p class="muted small" data-i18n="cmp_subtitle"></p>
    </div>
  </header>

  <main>
    <section id="drop" class="card drop" tabindex="0">
      <div class="drop-icon" aria-hidden="true">📄</div>
      <div>
        <strong data-i18n="cmp_drop"></strong>
        <div class="muted small" data-i18n="cmp_drop_sub"></div>
      </div>
      <label class="chipbtn primary-btn">
        <span data-i18n="cmp_choose"></span>
        <input id="fileInput" type="file" accept=".csv,text/csv" multiple hidden>
      </label>
    </section>
    <div id="errors" class="error" hidden></div>

    <section id="storesCard" class="card" hidden>
      <div class="section-head">
        <h2><span data-i18n="cmp_stores"></span> <span id="storeCount" class="muted"></span></h2>
        <div class="controls small">
          <label class="check"><input type="checkbox" id="includeNew"> <span data-i18n="cmp_include_new"></span></label>
          <button type="button" id="copySummary" class="chipbtn" data-i18n="cmp_copy"></button>
          <button type="button" id="clearAll" class="link" data-i18n="cmp_clear"></button>
        </div>
      </div>
      <div id="stores" class="stores"></div>
    </section>

    <section id="results" hidden>
      <div class="card">
        <div class="section-head">
          <h2><span data-i18n="ww_title"></span> <span class="info" data-i18n-title="ww_info">ⓘ</span></h2>
          <span id="resultNote" class="muted small"></span>
        </div>
        <div id="tiles" class="fx-tiles"></div>
      </div>
      <div id="charts" class="charts"></div>
    </section>

    <section id="empty" class="card empty-state">
      <p data-i18n="cmp_empty"></p>
    </section>
  </main>

  <script src="../utils/constants.js"></script>
  <script src="../analyzer/stats.js"></script>
  <script src="../analyzer/effects.js"></script>
  <script src="compare.js"></script>
</body>
</html>
