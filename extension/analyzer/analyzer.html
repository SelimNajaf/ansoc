<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reels Analyzer</title>
  <link rel="stylesheet" href="../ui/tokens.css">
  <link rel="stylesheet" href="analyzer.css">
</head>
<body>
  <!-- shared chart fills (tokens.css: .g-data-*); referenced as url(#gData) by the bars -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <linearGradient id="gData" x1="0" y1="1" x2="0" y2="0"><stop class="g-data-1" offset="0"/><stop class="g-data-2" offset="1"/></linearGradient>
    <linearGradient id="gHit" x1="0" y1="1" x2="0" y2="0"><stop class="g-hit-1" offset="0"/><stop class="g-hit-2" offset="1"/></linearGradient>
  </svg>
  <header class="top">
    <span class="logo" aria-hidden="true">↓</span>
    <div class="grow">
      <h1 data-i18n="an_title"></h1>
      <p class="muted small" data-i18n="an_subtitle"></p>
    </div>
    <span id="shotMsg" class="shot-msg small" aria-live="polite"></span>
    <button type="button" id="shotBtn" class="shot-btn" data-i18n-title="an_shot_tip" data-i18n-aria="an_shot_tip"><svg class="ico" data-icon="camera"></svg></button>
    <span id="helperBadge" class="badge"></span>
  </header>

  <main>
    <section id="cookieNotice" class="notice" hidden>
      <div>
        <strong data-i18n="an_login_title"></strong>
        <p class="small" data-i18n="an_login_body"></p>
      </div>
      <button id="enableCookies" type="button" class="primary" data-i18n="an_enable_login"></button>
    </section>

    <form id="fetchForm" class="card fetch" autocomplete="off">
      <label class="field grow">
        <span class="label" data-i18n="an_profile"></span>
        <input id="profileInput" type="text" spellcheck="false" placeholder="@username / https://www.instagram.com/username/reels/">
      </label>
      <label class="field">
        <span class="label" data-i18n="an_period"></span>
        <select id="periodSelect">
          <optgroup data-label="an_p_by_time">
            <option value="since:30" data-i18n="an_p_30"></option>
            <option value="since:60" data-i18n="an_p_60" selected></option>
            <option value="since:90" data-i18n="an_p_90"></option>
            <option value="since:180" data-i18n="an_p_180"></option>
            <option value="all" data-i18n="an_p_all"></option>
          </optgroup>
          <optgroup data-label="an_p_by_count">
            <option value="count:60" data-n="60"></option>
            <option value="count:120" data-n="120"></option>
            <option value="count:240" data-n="240"></option>
          </optgroup>
        </select>
      </label>
      <button id="fetchBtn" type="submit" class="primary" data-i18n="an_analyze"></button>
      <section id="profilePreview" class="pp" hidden aria-live="polite">
        <div class="pp-head">
          <strong id="ppName"></strong>
          <span id="ppCat" class="chip pp-cat" hidden></span>
          <span id="ppStats" class="pp-stats"></span>
        </div>
        <div id="ppBio" class="pp-bio small"></div>
        <div class="pp-foot small">
          <span id="ppLinks" class="pp-links"></span>
          <span id="ppHint" class="muted"></span>
        </div>
      </section>
    </form>

    <section id="progressBox" class="card loader" hidden aria-live="polite">
      <div class="ld-head">
        <div class="ld-count"><span id="ldCount">0</span><small data-i18n="an_ld_reels"></small></div>
        <div class="ld-mid">
          <div id="ldProfile" class="ld-profile"></div>
          <ol id="ldSteps" class="ld-steps">
            <li data-step="connect" data-i18n="an_ld_connect"></li>
            <li data-step="reels" data-i18n="an_ld_read"></li>
            <li data-step="details" data-i18n="an_ld_fill"></li>
          </ol>
        </div>
        <div id="ldTime" class="ld-time">0:00</div>
      </div>
      <div id="ldStrip" class="ld-strip" aria-hidden="true"></div>
      <div id="progressText" class="small muted ld-text"></div>
    </section>

    <div id="errorBox" class="error" hidden></div>

    <div id="results" hidden>
      <section class="profile card">
        <div>
          <div id="profileName" class="pname"></div>
          <div id="profileMeta" class="muted small"></div>
          <div id="profileExtra" class="pp-stats small"></div>
          <div id="profileBio" class="pp-bio small" hidden></div>
        </div>
        <div id="profileNote" class="muted small"></div>
        <div id="cacheNote" class="cache-note small" hidden></div>
      </section>

      <section id="rangeCard" class="card range">
        <div class="section-head">
          <div>
            <h2 data-i18n="an_rb_title"></h2>
          </div>
          <div class="controls small">
            <span id="rbCount" class="rb-count"></span>
            <button type="button" id="rbReset" class="link" data-i18n="an_rb_reset" hidden></button>
          </div>
        </div>
        <div class="rb-range">
          <span id="rbFromLabel" class="rb-date"></span>
          <span class="rb-arrow" aria-hidden="true">→</span>
          <span id="rbToLabel" class="rb-date"></span>
          <span id="rbLabel" class="rb-meta"></span>
        </div>
        <div id="rb" class="rb" data-i18n-title="an_rb_hint">
          <div id="rbStrip" class="rb-strip"></div>
          <div id="rbWindow" class="rb-window"></div>
          <div id="rbHandleA" class="rb-handle" role="slider" tabindex="0" data-i18n-aria="an_rb_from"><span class="grip"></span></div>
          <div id="rbHandleB" class="rb-handle" role="slider" tabindex="0" data-i18n-aria="an_rb_to"><span class="grip"></span></div>
          <div id="rbHover" class="rb-hover" hidden><span id="rbHoverText" class="rb-hover-text"></span></div>
        </div>
        <div class="rb-foot">
          <div class="legend small">
            <span><i class="sw rb-sw-curve"></i><span data-i18n="an_rb_lg_curve"></span></span>
            <span><i class="rb-sw-rug"></i><span data-i18n="an_rb_lg_viral"></span></span>
            <span><i class="sw rb-sw-pause"></i><span data-i18n="an_rb_lg_pause"></span></span>
          </div>
        </div>
        <div id="rbChips" class="quick small rb-chips"></div>
      </section>

      <section id="cards" class="kpis" aria-label="Statistics"></section>


      <section id="distCard" class="card">
        <div class="section-head">
          <h2 data-i18n="an_distribution"></h2>
          <div class="controls">
            <div class="seg" role="group" aria-label="Scale">
              <button type="button" id="scaleLog" class="seg-btn on" data-i18n="an_log"></button>
              <button type="button" id="scaleLinear" class="seg-btn" data-i18n="an_linear"></button>
            </div>
            <label class="check small"><input type="checkbox" id="clampOutliers" checked disabled> <span data-i18n="an_group_outliers"></span></label>
          </div>
        </div>
        <div id="chartWrap" class="chart-wrap"></div>
        <div class="legend small">
          <span><i class="sw bar-sw"></i><span data-i18n="an_legend_bars"></span></span>
          <span><i class="sw hit-sw"></i><span data-i18n="an_hit_word"></span></span>
          <span><i class="sw typ-sw"></i><span data-i18n="an_stat_typical"></span></span>
          <span><i class="sw line mean"></i><span data-i18n="an_mean"></span></span>
          <span><i class="sw line median"></i><span data-i18n="an_median"></span></span>
        </div>
      </section>

      <section id="activityCard" class="card">
        <div class="section-head">
          <div>
            <h2 data-i18n="an_activity"></h2>
            <p id="activityRange" class="muted small"></p>
          </div>
        </div>
        <div id="activityCards" class="kpi-row"></div>
        <div class="chart-bar">
          <div class="cb-group">
            <span class="small muted" data-i18n="an_interval"></span>
            <div id="intervalSeg" class="seg" role="group">
              <button type="button" class="seg-btn" data-days="1"></button>
              <button type="button" class="seg-btn" data-days="3"></button>
              <button type="button" class="seg-btn" data-days="7"></button>
              <button type="button" class="seg-btn" data-days="30"></button>
            </div>
          </div>
          <div class="cb-group">
            <span class="small muted" data-i18n="an_line_label"></span>
            <div id="viewsLineSeg" class="seg" role="group">
              <button type="button" class="seg-btn" data-line="total"></button>
              <button type="button" class="seg-btn" data-line="median"></button>
              <button type="button" class="seg-btn" data-line="off"></button>
            </div>
          </div>
        </div>
        <div id="activityWrap" class="chart-wrap"></div>
        <div class="legend small">
          <span><i class="sw act-sw"></i><span data-i18n="an_act_legend_bars"></span></span>
          <span><i class="sw hit-sw"></i><span data-i18n="an_hit_word"></span></span>
          <span id="viewsLegend"><i class="sw line views"></i><span id="viewsLegendText"></span></span>
        </div>

        <div class="ww">
          <div class="heat-head">
            <h3 class="sub"><span data-i18n="ww_title"></span> <span class="info" data-i18n-title="ww_info">ⓘ</span></h3>
            <div class="controls small">
              <span id="wwNote" class="muted small"></span>
              <span class="csv-export">
                <button type="button" id="csvBtn" class="chipbtn csv-btn" data-i18n="an_csv_btn"></button>
                <select id="csvFormat" class="csv-fmt" data-i18n-aria="an_csv_format">
                  <option value="excel">Excel (;)</option>
                  <option value="standard">Standard (,)</option>
                </select>
              </span>
            </div>
          </div>
          <div id="wwTiles" class="fx-tiles"></div>
          <div id="wwChart" class="ww-chart"></div>
        </div>
      </section>

      <section id="mapCard" class="card map-card">
        <div class="section-head">
          <h2><span data-i18n="an_map_title"></span> <span class="info" data-i18n-title="an_map_info">ⓘ</span></h2>
          <div class="controls">
            <div id="mapSeg" class="seg" role="group">
              <button type="button" class="seg-btn on" data-map="vs" data-i18n="an_map_vs"></button>
              <button type="button" class="seg-btn" data-map="cl" data-i18n="an_map_cl"></button>
            </div>
          </div>
        </div>
        <div id="mapWrap" class="chart-wrap map-wrap"></div>
        <div id="mapTip" class="map-tip" hidden></div>
        <div class="legend small">
          <span><i class="sw dot hit"></i><span data-i18n="an_tier_hit"></span></span>
          <span><i class="sw dot good"></i><span data-i18n="an_tier_good"></span></span>
          <span><i class="sw dot other"></i><span data-i18n="an_map_other"></span></span>
          <span><i class="sw dot new"></i><span data-i18n="an_map_new"></span></span>
          <span class="muted" data-i18n="an_map_hint"></span>
        </div>
      </section>

      <section id="reelsCard" class="card">
        <div class="section-head">
          <h2 data-i18n="an_reels"></h2>
        </div>
        <div id="filterBar" class="filterbar small" hidden>
          <span id="filterText"></span>
          <button type="button" id="clearFilter" class="link" data-i18n="an_clear_filter"></button>
        </div>
        <div id="filterChain" class="fchain small" aria-live="polite"></div>
        <div id="actionBar" class="actionbar" hidden>
          <div class="sel-info">
            <strong id="selCount">0</strong> <span data-i18n="an_selected"></span>
            <span id="selViews" class="muted small"></span>
          </div>
          <label class="ab-folder" data-i18n-title="an_folder">
            <span class="ab-folder-i" aria-hidden="true"><svg class="ico" data-icon="folder"></svg></span>
            <input id="collectionInput" type="text" spellcheck="false" data-i18n-aria="an_folder">
          </label>
          <button type="button" id="copyLinks" data-i18n="an_copy_links"></button>
          <button type="button" id="copyCaptions" data-i18n="an_copy_captions"></button>
          <button type="button" id="exportSel" data-i18n="an_exp_btn" data-i18n-title="an_exp_tip">⬇ Export data</button>
          <button type="button" id="cancelAll" class="danger" hidden></button>
          <button type="button" id="downloadSel" class="primary" data-i18n="an_download_selected"></button>
          <div id="actionMsg" class="small action-msg" aria-live="polite"></div>
        </div>
        <div class="table-wrap">
          <table id="reelTable">
            <colgroup>
              <col class="col-c-check">
              <col class="col-c-rank">
              <col class="col-c-reel">
              <col class="col-views">
              <col class="col-success">
              <col class="col-vpd">
              <col class="col-likes">
              <col class="col-comments">
              <col class="col-er">
              <col class="col-likeRate">
              <col class="col-commentRate">
              <col class="col-erAdj">
              <col class="col-c-st">
            </colgroup>
            <thead>
              <tr>
                <th class="c-check"><input type="checkbox" id="checkAll" aria-label="Select all shown"></th>
                <th class="num c-rank">#</th>
                <th class="fh c-reel" data-key="date"><button type="button" class="fh-btn"><i class="fh-i"></i><span data-i18n="an_col_reel"></span><i class="fh-sort"></i></button></th>
                <th class="num fh" data-key="views"><button type="button" class="fh-btn"><i class="fh-i"></i><span data-i18n="an_col_views"></span><i class="fh-sort"></i></button></th>
                <th class="num fh" data-key="success"><button type="button" class="fh-btn"><i class="fh-i"></i><span data-i18n="an_col_success"></span><i class="fh-sort"></i></button></th>
                <th class="num fh" data-key="vpd"><button type="button" class="fh-btn"><i class="fh-i"></i><span data-i18n="an_col_vpd"></span><i class="fh-sort"></i></button></th>
                <th class="num fh grp" data-key="likes"><button type="button" class="fh-btn"><i class="fh-i"></i><span data-i18n="an_col_likes"></span><i class="fh-sort"></i></button></th>
                <th class="num fh" data-key="comments"><button type="button" class="fh-btn"><i class="fh-i"></i><span data-i18n="an_col_comments"></span><i class="fh-sort"></i></button></th>
                <th class="num fh" data-key="er"><button type="button" class="fh-btn"><i class="fh-i"></i><span data-i18n="an_col_er"></span><i class="fh-sort"></i></button></th>
                <th class="num fh" data-key="likeRate"><button type="button" class="fh-btn"><i class="fh-i"></i><span data-i18n="an_col_likeRate"></span><i class="fh-sort"></i></button></th>
                <th class="num fh" data-key="commentRate"><button type="button" class="fh-btn"><i class="fh-i"></i><span data-i18n="an_col_commentRate"></span><i class="fh-sort"></i></button></th>
                <th class="num fh" data-key="erAdj"><button type="button" class="fh-btn"><i class="fh-i"></i><span data-i18n="an_col_erAdj"></span><i class="fh-sort"></i></button></th>
                <th class="c-st" data-i18n="an_col_status"></th>
              </tr>
            </thead>
            <tbody id="reelBody"></tbody>
          </table>
        </div>
        <div class="legend small er-legend table-foot">
          <span data-i18n="an_col_success"></span>
          <span><i class="succ hit" style="--p:90"><span class="succ-i"><svg class="ico" data-icon="target"></svg></span>90</i> <span data-i18n="an_tier_hit"></span> ≥ 80</span>
          <span><i class="succ good" style="--p:60">60</i> <span data-i18n="an_tier_good"></span> ≥ 50</span>
          <span><i class="fresh rising"></i><span data-i18n="an_sig_rising"></span></span>
          <span><i class="fresh"></i><span data-i18n="an_sig_new"></span></span>
          <span class="lg-sep" aria-hidden="true">|</span>
          <span data-i18n="an_er_bar"></span>
          <span><i class="sw like"></i><span data-i18n="an_col_likes"></span></span>
          <span><i class="sw comment"></i><span data-i18n="an_col_comments"></span></span>
        </div>
      </section>
    </div>
  </main>

  <div id="fpop" class="fpop" role="dialog" aria-modal="false" hidden></div>

  <dialog id="capDialog" class="capdlg" aria-labelledby="capTitle">
    <div class="capdlg-head">
      <strong id="capTitle"></strong>
      <button type="button" id="capClose" class="chipbtn" data-i18n-aria="an_dr_close">✕</button>
    </div>
    <div id="capNote" class="small muted"></div>
    <textarea id="capText" readonly spellcheck="false"></textarea>
    <div class="capdlg-actions">
      <button type="button" id="capCopy" class="primary" data-i18n="an_dr_copy"></button>
      <button type="button" id="capSave" data-i18n="an_cap_save"></button>
    </div>
  </dialog>

  <aside id="drawer" class="drawer" hidden role="dialog" aria-labelledby="drTitle">
    <div id="drResize" class="dr-resize" role="separator" aria-orientation="vertical" data-i18n-aria="an_dr_resize"></div>
    <div class="dr-head">
      <div class="grow">
        <div id="drTitle" class="dr-title"></div>
        <div id="drSub" class="muted small"></div>
      </div>
      <div class="dr-nav">
        <button type="button" id="drPrev" class="chipbtn" data-i18n-aria="an_dr_prev">←</button>
        <button type="button" id="drNext" class="chipbtn" data-i18n-aria="an_dr_next">→</button>
        <button type="button" id="drClose" class="chipbtn" data-i18n-aria="an_dr_close">✕</button>
      </div>
    </div>
    <div id="drBody" class="dr-body"></div>
  </aside>


  <script src="../utils/constants.js"></script>
  <script src="../utils/platforms.js"></script>
  <script src="../ui/icons.js"></script>
  <script src="stats.js"></script>
  <script src="effects.js"></script>
  <script src="analyzer.js"></script>
</body>
</html>
